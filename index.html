<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ASCII Lily Bouquet</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #030305;
      color: #fff;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      touch-action: manipulation;
      height: 100vh;
      width: 100vw;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .birthday-banner {
      position: fixed;
      bottom: 4%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      z-index: 10;
      width: 92%;
      opacity: 0;
      animation: fadeIn 2s ease-in-out 2.8s forwards;
    }
    .birthday-banner h1 {
      font-size: clamp(1.1rem, 4.8vw, 1.85rem);
      color: #ffd6e7;
      text-shadow: 0 0 12px rgba(255, 105, 180, 0.75);
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    .birthday-banner p {
      font-size: clamp(0.7rem, 2.6vw, 0.9rem);
      color: #98e69b;
      opacity: 0.8;
    }
    .replay-btn {
      position: fixed;
      top: 14px;
      right: 14px;
      background: rgba(15, 20, 15, 0.8);
      color: #a3e6a6;
      border: 1px solid rgba(163, 230, 166, 0.35);
      padding: 6px 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      z-index: 20;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <button class="replay-btn" id="replayBtn">↻ Replay</button>

  <div class="birthday-banner">
    <h1>happi burrday k :D</h1>
    <p></p>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // High-contrast ASCII character ramp for crisp scanline texture
    const ASCII_RAMP = " .'`^\",:;Il!i><~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";

    let width, height, scale;
    let cellW, cellH, cols, rows;
    let zBuffer, rBuffer, gBuffer, bBuffer, lBuffer;
    let stars = [];
    let sparkles = [];
    let startTime = performance.now();

    document.getElementById('replayBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      startTime = performance.now();
    });

    // Exact bouquet layout matching the reference photo's colors, layers, and depth (z)
    const flowers = [
      // Back row
      { x: -12,  y: -215, r: 78,  rot: 0.18, z: 10, delay: 0.55, cTip: [240, 170, 135], cMid: [215, 95, 70],   cCore: [130, 40, 25] }, // Top Center Peach
      { x: -82,  y: -175, r: 82,  rot: -0.25,z: 15, delay: 0.40, cTip: [255, 250, 235], cMid: [235, 215, 175], cCore: [165, 135, 80] }, // Top Left Cream White
      { x: 78,   y: -165, r: 80,  rot: 0.35, z: 15, delay: 0.50, cTip: [245, 215, 85],  cMid: [210, 155, 35],  cCore: [135, 80, 10] },  // Top Right Yellow

      // Middle row (outer)
      { x: -105, y: -90,  r: 86,  rot: -0.42,z: 22, delay: 0.35, cTip: [255, 210, 75],  cMid: [225, 150, 25],  cCore: [145, 75, 10] },  // Mid Left Golden
      { x: 102,  y: -85,  r: 84,  rot: 0.38, z: 22, delay: 0.45, cTip: [205, 45, 85],   cMid: [155, 18, 50],   cCore: [75, 5, 20] },    // Mid Right Burgundy

      // Upper Center Hero Red Lily
      { x: -4,   y: -135, r: 102, rot: 0.05, z: 35, delay: 0.15, cTip: [255, 65, 65],   cMid: [215, 22, 28],   cCore: [110, 8, 12] },   // Center Red Hero

      // Lower outer row
      { x: -98,  y: 35,   r: 82,  rot: -0.48,z: 28, delay: 0.60, cTip: [250, 225, 75],  cMid: [210, 165, 20],  cCore: [135, 95, 5] },   // Bottom Left Yellow
      { x: 92,   y: 42,   r: 76,  rot: 0.45, z: 28, delay: 0.65, cTip: [175, 30, 40],   cMid: [120, 12, 18],   cCore: [60, 4, 8] },     // Bottom Right Dark Red

      // Front Hero Trio (Pink, White, Peach-Gold)
      { x: -55,  y: -45,  r: 98,  rot: -0.22,z: 45, delay: 0.10, cTip: [255, 130, 205], cMid: [215, 45, 140],  cCore: [120, 10, 65] },  // Front Left Pink
      { x: 58,   y: -35,  r: 104, rot: 0.24, z: 50, delay: 0.05, cTip: [255, 255, 245], cMid: [225, 230, 200], cCore: [145, 165, 105] },// Front Right White
      { x: -8,   y: 48,   r: 102, rot: 0.08, z: 60, delay: 0.25, cTip: [255, 220, 165], cMid: [230, 145, 75],  cCore: [145, 65, 25] }   // Front Bottom Peach/Gold
    ];

    // Sleek, realistic sword-shaped lily leaves & stems at the base
    const blades = [
      { x0: -15, y0: 215, x1: -95,  y1: 110, cx: -65, cy: 155, w: 14, z: 18, delay: 0.0 },
      { x0: -10, y0: 218, x1: -75,  y1: 85,  cx: -50, cy: 145, w: 16, z: 25, delay: 0.05 },
      { x0: -6,  y0: 220, x1: -48,  y1: 75,  cx: -32, cy: 145, w: 17, z: 55, delay: 0.08 },
      { x0: -2,  y0: 222, x1: -22,  y1: 80,  cx: -14, cy: 150, w: 16, z: 62, delay: 0.10 },
      { x0: 2,   y0: 222, x1: 8,    y1: 78,  cx: 6,   cy: 150, w: 16, z: 58, delay: 0.12 },
      { x0: 6,   y0: 220, x1: 38,   y1: 82,  cx: 26,  cy: 150, w: 17, z: 63, delay: 0.14 },
      { x0: 10,  y0: 218, x1: 68,   y1: 95,  cx: 45,  cy: 152, w: 16, z: 26, delay: 0.06 },
      { x0: 15,  y0: 215, x1: 98,   y1: 125, cx: 62,  cy: 165, w: 14, z: 19, delay: 0.02 },
      { x0: 18,  y0: 212, x1: 112,  y1: 165, cx: 70,  cy: 185, w: 12, z: 15, delay: 0.04 },
      { x0: -18, y0: 212, x1: -108, y1: 155, cx: -68, cy: 180, w: 12, z: 15, delay: 0.03 },
      // Upper filler leaves peeking between blooms
      { x0: -40, y0: -90, x1: -125, y1: -145,cx: -85, cy: -125,w: 15, z: 12, delay: 0.25 },
      { x0: 40,  y0: -90, x1: 125,  y1: -140,cx: 85,  cy: -120,w: 15, z: 12, delay: 0.28 },
      { x0: -25, y0: -155,x1: -65,  y1: -245,cx: -50, cy: -205,w: 14, z: 8,  delay: 0.32 },
      { x0: 25,  y0: -155,x1: 65,   y1: -240,cx: 50,  cy: -200,w: 14, z: 8,  delay: 0.35 }
    ];

    function initGrid() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;

      scale = Math.min(width / 380, height / 650);
      // Horizontal scanline cell dimensions (wider vertically than horizontally for CRT stripe effect)
      cellW = Math.max(3.2, Math.floor(3.8 * scale));
      cellH = Math.max(5.5, Math.floor(6.5 * scale));

      cols = Math.ceil(width / cellW);
      rows = Math.ceil(height / cellH);

      const size = cols * rows;
      zBuffer = new Float32Array(size);
      rBuffer = new Uint8Array(size);
      gBuffer = new Uint8Array(size);
      bBuffer = new Uint8Array(size);
      lBuffer = new Float32Array(size);

      stars = Array.from({ length: 75 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        phase: Math.random() * Math.PI * 2
      }));
    }

    window.addEventListener('resize', initGrid);
    initGrid();

    window.addEventListener('pointerdown', (e) => {
      if (e.target.id === 'replayBtn') return;
      for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3.5;
        sparkles.push({
          x: e.clientX,
          y: e.clientY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1,
          life: 1.0,
          char: ['*', '+', '·', '✦'][Math.floor(Math.random() * 4)]
        });
      }
    });

    function smoothstep(min, max, value) {
      const x = Math.max(0, Math.min(1, (value - min) / (max - min)));
      return x * x * (3 - 2 * x);
    }

    function easeOutQuart(x) {
      return 1 - Math.pow(1 - Math.max(0, Math.min(1, x)), 4);
    }

    function plotCell(c, r, z, red, green, blue, lum) {
      if (c < 0 || c >= cols || r < 0 || r >= rows) return;
      const idx = r * cols + c;
      if (z >= zBuffer[idx]) {
        zBuffer[idx] = z;
        rBuffer[idx] = Math.min(255, Math.max(0, red | 0));
        gBuffer[idx] = Math.min(255, Math.max(0, green | 0));
        bBuffer[idx] = Math.min(255, Math.max(0, blue | 0));
        lBuffer[idx] = Math.min(1, Math.max(0, lum));
      }
    }

    // Rasterize sleek, ribbed green blades at the base of the bouquet
    function rasterizeBlades(cx, cy, t) {
      blades.forEach((b, idx) => {
        const grow = easeOutQuart((t - b.delay) * 0.85);
        if (grow <= 0) return;

        const sway = Math.sin(t * 1.4 + idx * 0.7) * 5 * scale;
        const x0 = cx + b.x0 * scale;
        const y0 = cy + b.y0 * scale;
        const x1 = cx + b.x1 * scale + sway;
        const y1 = cy + b.y1 * scale;
        const ctrlX = cx + b.cx * scale + sway * 0.5;
        const ctrlY = cy + b.cy * scale;

        const steps = 65;
        const maxSteps = Math.floor(steps * grow);

        for (let i = 0; i <= maxSteps; i++) {
          const u = i / steps;
          const invU = 1 - u;

          // Quadratic Bezier spine
          const px = invU * invU * x0 + 2 * invU * u * ctrlX + u * u * x1;
          const py = invU * invU * y0 + 2 * invU * u * ctrlY + u * u * y1;

          // Tangent normal for blade thickness
          const tx = 2 * invU * (ctrlX - x0) + 2 * u * (x1 - ctrlX);
          const ty = 2 * invU * (ctrlY - y0) + 2 * u * (y1 - ctrlY);
          const len = Math.hypot(tx, ty) || 1;
          const nx = -ty / len;
          const ny = tx / len;

          // Taper neatly to a sharp point at u=1
          const widthProfile = Math.sin(Math.pow(u, 0.65) * Math.PI) * (1 - u * 0.25);
          const halfW = (b.w * scale * 0.5) * widthProfile;
          const wSteps = Math.ceil(halfW / (cellW * 0.5));

          for (let w = -wSteps; w <= wSteps; w++) {
            const v = wSteps === 0 ? 0 : w / wSteps; // -1 to 1
            const absV = Math.abs(v);
            const wx = px + nx * v * halfW;
            const wy = py + ny * v * halfW;

            const c = Math.round(wx / cellW);
            const r = Math.round(wy / cellH);

            // Crisp bright edges & recessed dark-green center vein like the reference image
            const centerVein = Math.exp(-v * v * 12);
            const edgeRim = Math.pow(absV, 1.4);
            const tipFade = 1 - u * 0.25;

            const red   = (30 + edgeRim * 55 + centerVein * 40) * tipFade;
            const green = (105 + edgeRim * 115 + centerVein * 65 - absV * 20) * tipFade;
            const blue  = (35 + edgeRim * 50 + centerVein * 30) * tipFade;
            const lum   = (0.38 + edgeRim * 0.45 + centerVein * 0.25) * tipFade;

            plotCell(c, r, b.z + (1 - absV) * 0.5, red, green, blue, lum);
          }
        }
      });
    }

    // Rasterize each 6-petaled lily onto the character grid
    function rasterizeLily(f, cx, cy, t) {
      const elapsed = (t - f.delay) * 0.55;
      if (elapsed <= 0) return;

      const bloom = easeOutQuart(elapsed);
      const swayX = Math.sin(t * 1.5 + f.x * 0.05) * 3.5 * scale;
      const swayY = Math.cos(t * 1.2 + f.y * 0.05) * 2.5 * scale;

      const fx = cx + f.x * scale + swayX;
      const fy = cy + f.y * scale + swayY;

      // Smoothly expand from a compact star bud into full size with subtle rotation
      const currentR = f.r * scale * (0.18 + 0.82 * bloom);
      const currentRot = f.rot + (1 - bloom) * 0.25;

      // Bounding box in grid cells (just like ymin/ymax in the screenshot's code!)
      const cMin = Math.max(0, Math.floor((fx - currentR * 1.08) / cellW));
      const cMax = Math.min(cols - 1, Math.ceil((fx + currentR * 1.08) / cellW));
      const rMin = Math.max(0, Math.floor((fy - currentR * 1.08) / cellH));
      const rMax = Math.min(rows - 1, Math.ceil((fy + currentR * 1.08) / cellH));

      // Evaluate each of the 6 petals (3 back tepals: 0,2,4 | 3 front petals: 1,3,5)
      for (let c = cMin; c <= cMax; c++) {
        const px = c * cellW - fx;
        for (let r = rMin; r <= rMax; r++) {
          const py = r * cellH - fy;
          const dist = Math.hypot(px, py);
          if (dist > currentR * 1.05) continue;

          const baseTheta = Math.atan2(py, px) - currentRot;

          // Check petals (front layer overlaps back layer where they meet)
          for (let p = 0; p < 6; p++) {
            const isFrontLayer = (p % 2 === 1);
            const petalAngle = (p * Math.PI) / 3;

            // Wrap angle distance to [-PI, PI]
            let dTheta = baseTheta - petalAngle;
            dTheta = Math.atan2(Math.sin(dTheta), Math.cos(dTheta));

            // Slight natural wave in the petal centerline
            const wave = Math.sin((dist / currentR) * Math.PI) * 0.04 * (p % 2 === 0 ? 1 : -1);
            const localAngle = Math.abs(dTheta - wave);

            // Normalized distance from flower center (0) to petal tip (1)
            const u = dist / currentR;
            if (u > 1.0) continue;

            // Authentic lily petal angular width envelope:
            // Wide belly in the middle, overlapping near base, tapering to a sharp pointed tip
            const maxAngle = (isFrontLayer ? 0.44 : 0.41) * Math.sin(Math.pow(u, 0.68) * Math.PI) + 0.09 * (1 - u);

            if (localAngle <= maxAngle) {
              // v goes from 0 (central midrib vein) to 1 (outer petal edge)
              const v = localAngle / (maxAngle || 0.001);

              // Z-depth: front petals sit above back petals; petal center arches higher than edges
              const layerZ = isFrontLayer ? 2.2 : 0.0;
              const archZ = Math.sin(u * Math.PI) * (1 - v * v * 0.6) * 1.5;
              const petalZ = f.z + layerZ + archZ;

              // 3-stop botanical color gradient (deep throat -> rich mid-petal -> bright tip/margins)
              let red, green, blue;
              if (u < 0.45) {
                const tGrad = u / 0.45;
                red   = f.cCore[0] + (f.cMid[0] - f.cCore[0]) * tGrad;
                green = f.cCore[1] + (f.cMid[1] - f.cCore[1]) * tGrad;
                blue  = f.cCore[2] + (f.cMid[2] - f.cCore[2]) * tGrad;
              } else {
                const tGrad = (u - 0.45) / 0.55;
                red   = f.cMid[0] + (f.cTip[0] - f.cMid[0]) * tGrad;
                green = f.cMid[1] + (f.cTip[1] - f.cMid[1]) * tGrad;
                blue  = f.cMid[2] + (f.cTip[2] - f.cMid[2]) * tGrad;
              }

              // Deep recessed central midrib groove & bright satin side ridges
              const midribGroove = Math.exp(-v * v * 28);
              const satinPillow = Math.sin(v * Math.PI);
              const edgeLight = Math.pow(v, 2.2) * 0.35;
              // Longitudinal ribs along the petal
              const veinRibs = Math.sin(v * 18) * 0.06;

              // Ambient occlusion shadow on back petals and deep center throat
              const layerShade = isFrontLayer ? 1.04 : 0.84;
              const throatDepth = 0.55 + 0.45 * smoothstep(0.0, 0.32, u);

              // Greenish-yellow nectar star deep inside the throat
              if (u < 0.16) {
                const nectar = 1 - u / 0.16;
                red   = red * (1 - nectar * 0.55) + 95 * nectar;
                green = green * (1 - nectar * 0.55) + 165 * nectar;
                blue  = blue * (1 - nectar * 0.55) + 45 * nectar;
              }

              // Dark crimson/brown lily papillae speckles in the inner throat/belly
              const speckleNoise = Math.sin(c * 12.9898 + r * 78.233 + p * 7.1);
              let speckleFactor = 1.0;
              if (u > 0.14 && u < 0.52 && v < 0.75 && speckleNoise > 0.88) {
                speckleFactor = 0.38;
              }

              // Dark edge line where front petal overlaps back petal
              const edgeAO = v > 0.9 ? 0.72 : 1.0;

              const shade = layerShade * throatDepth * speckleFactor * edgeAO * (0.78 + satinPillow * 0.25 + edgeLight - midribGroove * 0.22 + veinRibs);

              red   *= shade;
              green *= shade;
              blue  *= shade;

              const lum = Math.min(0.98, (0.299 * red + 0.587 * green + 0.114 * blue) / 255);
              plotCell(c, r, petalZ, red, green, blue, lum);
            }
          }
        }
      }

      // Draw realistic curved stamens and rich orange-rust pollen anthers in the center
      if (bloom > 0.3) {
        const stamenProgress = smoothstep(0.3, 1.0, bloom);
        for (let s = 0; s < 6; s++) {
          const sAngle = currentRot + (s * Math.PI) / 3 + 0.18 + Math.sin(t * 2 + s) * 0.03;
          const sLen = currentR * 0.38 * stamenProgress;

          for (let step = 1; step <= 12; step++) {
            const u = step / 12;
            const sx = fx + Math.cos(sAngle) * sLen * u;
            const sy = fy + Math.sin(sAngle) * sLen * u - Math.sin(u * Math.PI) * 5 * scale;
            const sc = Math.round(sx / cellW);
            const sr = Math.round(sy / cellH);

            if (step >= 10) {
              // Rust-orange / golden pollen anther at tip
              plotCell(sc, sr, f.z + 5, 250, 155, 45, 0.95);
              plotCell(sc + 1, sr, f.z + 5, 220, 110, 30, 0.88);
            } else {
              // Pale lime-pink stamen filament
              plotCell(sc, sr, f.z + 4, 215, 235, 145, 0.72);
            }
          }
        }
      }
    }

    function animate(now) {
      const t = (now - startTime) * 0.001;

      // Clear Z-buffer and luminance buffer
      zBuffer.fill(0);
      lBuffer.fill(0);

      // Clear screen
      ctx.fillStyle = '#030305';
      ctx.fillRect(0, 0, width, height);

      // 1. Twinkling background stars
      const fontSize = Math.max(6, Math.floor(cellH * 0.95));
      ctx.font = `bold ${fontSize}px "Courier New", monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      stars.forEach(s => {
        const alpha = 0.15 + 0.65 * Math.sin(t * 2 + s.phase);
        if (alpha > 0.25) {
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(2)})`;
          ctx.fillText('.', s.x, s.y);
        }
      });

      const cx = width * 0.5;
      const cy = height * 0.47;

      // 2. Rasterize foliage & flowers into the Z-buffer
      rasterizeBlades(cx, cy, t);
      flowers.forEach(f => rasterizeLily(f, cx, cy, t));

      // 3. Render the 2D character grid in crisp horizontal scanlines
      const rampLen = ASCII_RAMP.length - 1;
      for (let r = 0; r < rows; r++) {
        const py = r * cellH + cellH * 0.5;
        const rowOffset = r * cols;
        for (let c = 0; c < cols; c++) {
          const idx = rowOffset + c;
          if (zBuffer[idx] > 0) {
            const lum = lBuffer[idx];
            const charIdx = Math.max(1, Math.min(rampLen, (lum * rampLen) | 0));
            ctx.fillStyle = `rgb(${rBuffer[idx]},${gBuffer[idx]},${bBuffer[idx]})`;
            ctx.fillText(ASCII_RAMP[charIdx], c * cellW + cellW * 0.5, py);
          }
        }
      }

      // 4. Render tap sparkles
      for (let i = sparkles.length - 1; i >= 0; i--) {
        const sp = sparkles[i];
        sp.x += sp.vx;
        sp.y += sp.vy;
        sp.vy += 0.04;
        sp.life -= 0.022;
        if (sp.life <= 0) {
          sparkles.splice(i, 1);
        } else {
          ctx.fillStyle = `rgba(255, 225, 160, ${sp.life.toFixed(2)})`;
          ctx.fillText(sp.char, sp.x, sp.y);
        }
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
